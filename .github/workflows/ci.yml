name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm --filter @ajis/shared test
      - run: pnpm --filter @ajis/worker test
      - run: pnpm --filter @ajis/shared typecheck
      - run: pnpm --filter @ajis/db typecheck

  migrations:
    name: Migration smoke test (PostGIS 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: smoke, POSTGRES_DB: postgres }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: SMOKE_DB_URL=postgres://postgres:smoke@127.0.0.1:55432/postgres bash supabase/tests/smoke.sh
